name: Dev Build

# 推送到 dev 分支后，并行构建 Windows、macOS 和 Docker 产物，最后统一发布。
on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: worktools
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  build_windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    outputs:
      dev_version: ${{ steps.meta.outputs.dev_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute dev version
        id: meta
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "dev_version=dev-$shortSha" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Tauri 的 beforeBuildCommand 会同时生成 Web/PWA dist。
      - name: Build Web and Windows app
        run: npm run tauri:build

      - name: Collect Windows and Web artifacts
        shell: pwsh
        env:
          DEV_VERSION: ${{ steps.meta.outputs.dev_version }}
        run: |
          $staging = Join-Path $PWD "release-staging"
          $bundleRoot = Join-Path $PWD "src-tauri\target\$env:WINDOWS_TARGET\release\bundle"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot "msi") -Filter "*.msi" -File)
          $nsis = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot "nsis") -Filter "*-setup.exe" -File)
          if ($msi.Count -ne 1) { throw "Expected one MSI artifact, found $($msi.Count)." }
          if ($nsis.Count -ne 1) { throw "Expected one NSIS artifact, found $($nsis.Count)." }
          if (-not (Test-Path -LiteralPath "dist\index.html")) { throw "Web dist is missing." }

          Copy-Item -LiteralPath $msi[0].FullName -Destination (Join-Path $staging "$env:APP_NAME-$env:DEV_VERSION-windows-x64.msi")
          Copy-Item -LiteralPath $nsis[0].FullName -Destination (Join-Path $staging "$env:APP_NAME-$env:DEV_VERSION-windows-x64-setup.exe")
          Compress-Archive -Path "dist\*" -DestinationPath (Join-Path $staging "$env:APP_NAME-$env:DEV_VERSION-web.zip") -Force
          Get-ChildItem -LiteralPath $staging | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-windows-x64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  build_macos:
    name: Build macOS artifact
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run tauri -- build --bundles dmg

      - name: Collect macOS artifact
        shell: bash
        run: |
          staging="release-staging"
          bundle_root="src-tauri/target/release/bundle/dmg"
          dev_version="dev-${GITHUB_SHA:0:7}"
          mkdir -p "$staging"

          dmg_count="$(find "$bundle_root" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [ "$dmg_count" -ne 1 ]; then
            echo "Expected one DMG artifact, found $dmg_count." >&2
            exit 1
          fi

          dmg="$(find "$bundle_root" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          cp "$dmg" "$staging/${APP_NAME}-${dev_version}-macos-arm64.dmg"
          ls -lh "$staging"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-macos-arm64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  build_docker:
    name: Build Docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag "${APP_NAME}-ci:${GITHUB_SHA}" .

      - name: Export Docker image
        shell: bash
        run: |
          mkdir -p docker-staging
          docker save "${APP_NAME}-ci:${GITHUB_SHA}" | gzip -1 > docker-staging/worktools-image.tar.gz
          test -s docker-staging/worktools-image.tar.gz
          ls -lh docker-staging/worktools-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: dev-docker-image
          path: docker-staging/worktools-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish dev artifacts and Docker image
    needs:
      - build_windows
      - build_macos
      - build_docker
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dev-build-*
          path: release-assets
          merge-multiple: true

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: dev-docker-image
          path: docker-image

      - name: Load Docker image
        shell: bash
        run: gzip -dc docker-image/worktools-image.tar.gz | docker load

      - name: Install changelog dependency
        run: python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3

      - name: Generate dev release notes
        shell: bash
        env:
          DEV_VERSION: ${{ needs.build_windows.outputs.dev_version }}
        run: |
          python3 .github/scripts/generate_changelog.py \
            --mode dev \
            --current-ref "$GITHUB_SHA" \
            --intro "worktools dev 分支自动构建，包含 Windows、macOS 和 Docker 产物。" \
            --output release-notes.md
          build_time="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat >> release-notes.md <<EOF

          ---

          | 项目 | 值 |
          |---|---|
          | 版本 | \`${DEV_VERSION}\` |
          | 分支 | \`dev\` |
          | 提交 | [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |
          | 构建时间（北京时间） | ${build_time} |
          | Docker 镜像 | \`${image_name}:dev-latest\` |

          > 此预发布版本会在下一次推送到 dev 分支时被覆盖。
          EOF

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Push Docker image to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_VERSION: ${{ needs.build_windows.outputs.dev_version }}
        run: |
          local_image="${APP_NAME}-ci:${GITHUB_SHA}"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$local_image" "$image_name:dev-latest"
          docker tag "$local_image" "$image_name:$DEV_VERSION"
          docker push "$image_name:dev-latest"
          docker push "$image_name:$DEV_VERSION"

          echo "Docker image: $image_name:dev-latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable tag: $image_name:$DEV_VERSION" >> "$GITHUB_STEP_SUMMARY"

      # 仅在三个构建节点全部成功后重置 dev-latest。
      - name: Delete previous dev-latest release and tag
        uses: actions/github-script@v7
        env:
          TAG_NAME: dev-latest
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_NAME;

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Publish dev-latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: worktools dev-latest
          prerelease: true
          draft: false
          make_latest: false
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
