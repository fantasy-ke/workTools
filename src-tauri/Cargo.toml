[package]
name = "worktools"
version = "0.1.0"
description = "Local-first API payload and Cron workbench"
authors = ["worktools"]
edition = "2021"

[lib]
name = "worktools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61.3"
